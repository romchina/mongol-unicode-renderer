name: checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable test --locked --doc
      - run: cargo +stable run --locked --example render -- tests/fonts/NotoSansMongolian-Regular.ttf output/demo.png
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - run: cargo +stable check --locked --lib --target wasm32-unknown-unknown
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked --lib
